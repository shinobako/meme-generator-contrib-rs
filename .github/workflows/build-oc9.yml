name: Build

on:
  push:
    branches: [main]
    paths: ["Cargo.toml", "src/**"]
  pull_request:
    paths: ["Cargo.toml", "src/**"]
  workflow_dispatch:

permissions:
  contents: read

env:
  # 必须和 AstrBot 里 meme_generator_core 的编译版本一致，否则加载时报
  # "compiled with rustc X, but ... compiled with Y"
  RUST_VERSION: "1.93.1"

jobs:
  build_opencloudos_x86_64:
    runs-on: ubuntu-latest
    container:
      image: opencloudos/opencloudos:9.0

    steps:
      - name: Install build deps
        run: |
          dnf -y install gcc gcc-c++ make cmake git curl \
            clang clang-devel ninja-build python3 perl \
            fontconfig-devel freetype-devel libstdc++-devel
          dnf clean all

      - uses: actions/checkout@v5

      - name: Install Rust ${{ env.RUST_VERSION }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-unknown-linux-gnu

      - uses: swatinem/rust-cache@v2
        with:
          key: rustc-${{ env.RUST_VERSION }}

      - name: Build
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - uses: actions/upload-artifact@v6
        with:
          name: meme-generator-contrib-opencloudos9-x86_64
          path: target/x86_64-unknown-linux-gnu/release/*.so
