name: Build

on:
  push:
    branches: [main]
    paths: ["Cargo.toml", "src/**"]
  pull_request:
    paths: ["Cargo.toml", "src/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_opencloudos_x86_64:
    runs-on: ubuntu-latest
    container:
      image: opencloudos/opencloudos:9.6

    steps:
      - name: Install build deps
        run: |
          dnf -y install gcc gcc-c++ make cmake git curl \
            clang clang-devel ninja-build python3 perl \
            fontconfig-devel freetype-devel libstdc++-devel
          dnf clean all

      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - uses: actions/upload-artifact@v6
        with:
          name: meme-generator-contrib-opencloudos9-x86_64
          path: target/x86_64-unknown-linux-gnu/release/*.so
